name: Android Create Jar

# Only run manually
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Ensure release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="37.0"
        if ! gh release view "$TAG"; then
          gh release create --title "Hidden API jar for SDK version $TAG" "$TAG"
        fi
    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run emulator
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: "37.0"
        target: google_apis_ps16k
        arch: x86_64
        profile: pixel_7_pro
        script: ./cli/hiddenjar doctor && ./cli/hiddenjar build

    - name: Upload jar
      uses: actions/upload-artifact@v7
      with:
        path: ./android-37-custom.jar
        archive: false

    - name: Release jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="37.0"
        gh release edit --notes "Android hidden API jar built by GitHub Actions" "$TAG"
        gh release upload --clobber "$TAG" "./android-37-custom.jar"
